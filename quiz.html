<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Викторина по философии</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#d9d8d0;--ac:#3a5ba0;--acf:#fff;--ok:#1f7a45;--okb:#e1f3e8;--no:#b3392f;--nob:#fbe6e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--card:#222427;--bd:#3a3c40;--ac:#7f9fe0;--acf:#101214;--ok:#6fd49a;--okb:#16301f;--no:#f08b82;--nob:#3a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--card:#222427;--bd:#3a3c40;--ac:#7f9fe0;--acf:#101214;--ok:#6fd49a;--okb:#16301f;--no:#f08b82;--nob:#3a1d1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.5rem;margin:.4em 0 .2em}
p.m{color:var(--mut);margin:.2em 0 1em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
.mode{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.mode b{display:block}.mode span{color:var(--mut);font-size:.9rem}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;gap:8px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:0 0 9px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.opt .l{font-weight:700;color:var(--ac);min-width:1.2em}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.next,.pri{display:block;width:100%;margin-top:6px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acf);font-weight:600}
.sec{background:none;border:1px solid var(--bd);color:var(--fg);margin-top:10px}
.score{font-size:2.6rem;font-weight:700;margin:.2em 0}
.link{background:none;border:0;color:var(--mut);padding:6px 0;text-decoration:underline}
.hide{display:none}
</style></head><body><main>
<div id="start">
<h1>Викторина по философии</h1>
<p class="m">300 вопросов, у каждого четыре варианта ответа. Правильный ответ подсвечивается сразу.</p>
<button class="mode" data-m="all"><b>Все 300 по порядку</b><span>Как в исходном вопроснике</span></button>
<button class="mode" data-m="r20"><b>20 случайных</b><span>Быстрая проверка</span></button>
<button class="mode" data-m="r50"><b>50 случайных</b><span>Тренировка</span></button>
<button class="mode" data-m="r100"><b>100 случайных</b><span>Серьёзная проверка</span></button>
<button class="mode" data-m="jump"><b>С определённого вопроса</b><span>Продолжить с номера, который вы выберете</span></button>
</div>
<div id="quiz" class="hide">
<div class="top"><span id="cnt"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><p class="q" id="qt"></p><div id="ops"></div>
<button class="next hide" id="nx">Дальше</button></div>
<button class="link" id="stop">Закончить досрочно</button>
</div>
<div id="res" class="hide">
<h1>Результат</h1>
<div class="card"><div class="score" id="rs"></div><p class="m" id="rp"></p>
<button class="pri hide" id="rw">Работа над ошибками</button>
<button class="pri sec" id="ag">В начало</button></div>
</div>
</main>
<script>

е?",["Экспериментальная наука","Мифология","Опытное естествознание","Религия (христианское вероучение)"],3],["Какой раздел философии изучает проблему познания?",["Этика","Аксиология","Гносеология","Онтология"],2],["Как называется философское учение о бытии?",["Онтология","Гносеология","Логика","Аксиология"],0],["В какой науке изучают закон достаточного основания?",["Диалектика","Этика","Эстетика","Логика"],3],["Что является способом существования материи?",["Масса","Движение","Покой","Энергия"],1],["Что такое время?",["Мера количества вещества","Субъективное ощущение, не имеющее объективной основы","Форма существования материи, выражающая протяжённость и структуру тел","Форма существования материи, выражающая длительность и последовательность процессов"],3],["Какая форма движения материи является наиболее сложной?",["Физическая","Химическая","Механическая","Социальная"],3],["Что такое развитие?",["Любое механическое перемещение тел","Необратимое, направленное, закономерное изменение материи и сознания","Повторение одних и тех же состояний","Полное отсутствие изменений"],1],["С чего начинается процесс познания?",["С построения научной теории","С чувственного познания (ощущений)","С формулирования закона","С умозаключения"],1],["С чего начинается путь познания объективной реальности?",["С научной теории","С живого созерцания (чувственного познания)","С веры","С абстрактного мышления"],1],["В какой науке изучают закон тождества?",["Психология","Онтология","Этика","Логика"],3],["Какой метод научного познания строится на основе перехода от единичных фактов к общим положениям?",["Аналогия","Дедукция","Анализ","Индукция"],3],["Человек – какое существо - биологическое или социальной?",["Только социальное существо","Только биологическое существо","Биосоциальное существо","Только духовное существо"],2],["Каким еще философским термином обозначается теория познания?",["Аксиология","Антропология","Онтология","Гносеология"],3],["С какого языка пришло слово логика?",["С арабского","С санскрита","С греческого","С латинского"],2],["Что такое аксиология?",["Учение о бытии","Учение о познании","Учение о человеке","Учение о ценностях"],3],["Как называется раздел философии, изучающий природу ценностей?",["Антропология","Онтология","Гносеология","Аксиология"],3],["В чем принципиальная разница между материализмом и идеализмом?",["В отношении к религиозным обрядам","В количестве признаваемых начал бытия","В решении вопроса о первичности материи или сознания","В оценке познаваемости мира"],2],["В какой науке изучают закон взаимного перехода количественных и качественных изменений?",["Диалектика","Эстетика","Логика","Этика"],0],["Какие есть формы движения материи?",["Статическая, динамическая, случайная","Только механическая и физическая","Механическая, физическая, химическая, биологическая, социальная","Первичная, вторичная, третичная"],2],["Дао – основное понятие в учении какого философа?",["Мэн-цзы","Конфуция","Лао-цзы","Мо-цзы"],2],["В какой –религиозно-философской системе основные положения назывались “четыре благородные истины”?",["Индуизм","Джайнизм","Даосизм","Буддизм"],3],["Как переводится с греческого слово «теология»?",["Учение о Боге","Учение о ценностях","Учение о душе","Учение о человеке"],0],["Ли (порядок) — основное понятие какой философской системы?",["Легизма","Моизма","Конфуцианства","Даосизма"],2],["Какие существуют разновидности идеализма?",["Вульгарный и классический","Объективный и субъективный","Стихийный и научный","Метафизический и диалектический"],1],["Что такое объективный идеализм?",["Признание первичными ощущений отдельного человека","Признание первичной материи","Признание первичным духовного начала, существующего независимо от человека","Признание двух равноправных начал — материи и духа"],2],["Этимология слова “Философия” (что означает при переводе на русский язык?)",["Искусство красноречия","Любовь к мудрости","Наука о природе","Учение о Боге"],1],["Какие есть основные функции философии?",["Мировоззренческая, методологическая, гносеологическая, аксиологическая, прогностическая","Исключительно мифологическая и религиозная","Только торговая и производственная","Только политическая и военная"],0],["Что такое дуализм?",["Учение о первичности только материи","Учение о двух независимых началах — материи и духе","Учение о единой первооснове мира","Учение о непознаваемости мира"],1],["Что такое монизм?",["Учение о двух независимых началах","Учение о непознаваемости мира","Учение о единой первооснове мира","Учение о множестве равноправных начал"],2],["Что такое материализм с позиции философии?",["Направление, отрицающее существование материи","Направление, признающее первичность материи и вторичность сознания","Направление, признающее первичность сознания и вторичность материи","Направление, признающее равноправие материи и сознания"],1],["Что такое идеализм с позиции философии?",["Направление, признающее равноправие материи и духа","Направление, признающее первичность материи","Направление, отрицающее существование духа","Направление, признающее первичность духа и сознания"],3],["Что такое агностицизм?",["Учение о двух началах мира","Отрицание существования внешнего мира","Учение о полной познаваемости мира","Учение о принципиальной непознаваемости мира (или его сущности)"],3],["Что такое онтология?",["Учение о морали","Учение о познании","Учение о ценностях","Учение о бытии"],3],["В чем специфика первобытно-религиозного мировоззрения?",["Учение о единой мировой идее","Опора на научные доказательства","Рациональное обоснование мира понятиями","Вера в сверхъестественное: анимизм, тотемизм, фетишизм"],3],["Что такое мифологическое мировоззрение?",["Логическое объяснение мира с помощью понятий","Образно-фантастическое объяснение мира, олицетворение сил природы","Объяснение мира через опыт и эксперимент","Строгая система научных доказательств"],1],["К какому приему образования понятий относится операция: установление сходства или различия предметов действительности?",["Сравнение","Обобщение" var L=["А","Б","В","Г"],$=function(i){return document.getElementById(i)};
var list=[],pos=0,score=0,wrong=[],done=false;
function show(id){["start","quiz","res"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function begin(l){list=l;pos=0;score=0;wrong=[];show("quiz");draw()}
function all(){return D.map(function(_,i){return i})}
function draw(){
  var q=D[list[pos]];done=false;
  $("cnt").textContent="Вопрос "+(pos+1)+" из "+list.length+" (№"+(list[pos]+1)+")";
  $("sc").textContent="Верно: "+score;
  $("pb").style.width=(pos/list.length*100)+"%";
  $("qt").textContent=q[0];
  var o=$("ops");o.textContent="";
  q[1].forEach(function(t,k){
    var b=document.createElement("button");b.className="opt";
    var l=document.createElement("span");l.className="l";l.textContent=L[k]+")";
    var s=document.createElement("span");s.textContent=t;
    b.appendChild(l);b.appendChild(s);b.onclick=function(){pick(k)};o.appendChild(b)});
  $("nx").classList.add("hide");
  $("nx").textContent=pos===list.length-1?"Показать результат":"Дальше";
}
function pick(k){
  if(done)return;done=true;var q=D[list[pos]],bs=$("ops").children;
  for(var i=0;i<bs.length;i++){bs[i].disabled=true}
  bs[q[2]].classList.add("ok");
  if(k===q[2]){score++}else{bs[k].classList.add("no");wrong.push(list[pos])}
  $("sc").textContent="Верно: "+score;
  $("nx").classList.remove("hide");$("nx").focus({preventScroll:true});
}
function finish(){
  var n=done?pos+1:pos;if(n<1)n=1;
  var p=Math.round(score/n*100);
  $("rs").textContent=score+" из "+n+" ("+p+"%)";
  $("rp").textContent=p>=86?"Отлично!":p>=71?"Хорошо":p>=56?"Удовлетворительно":"Стоит повторить материал";
  $("rw").classList.toggle("hide",!wrong.length);
  $("rw").textContent="Работа над ошибками ("+wrong.length+")";
  show("res")}
$("nx").onclick=function(){if(pos>=list.length-1){pos++;done=false;finish()}else{pos++;draw()}};
$("stop").onclick=function(){finish()};
$("ag").onclick=function(){show("start")};
$("rw").onclick=function(){begin(shuf(wrong.slice()))};
document.querySelectorAll(".mode").forEach(function(b){b.onclick=function(){
  var m=b.getAttribute("data-m");
  if(m==="all")begin(all());
  else if(m==="jump"){var v=parseInt(prompt("С какого вопроса начать? (1–300)","1"),10);if(v>=1&&v<=300)begin(all().slice(v-1))}
  else begin(shuf(all()).slice(0,parseInt(m.slice(1),10)))}});
</script></body></html>
